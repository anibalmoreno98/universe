<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete</title>
</head>
<body>
    <h1>Borrar la película</h1>
    <div th:if="${borrada}">
        <p>La película <span th:text="${titulo}"></span> se ha borrado</p>
    </div>
        <div th:if="${!borrada}">
        <p>La película <span th:text="${titulo}"></span> no se ha borrado</p>
    </div>
</body>
</html>
