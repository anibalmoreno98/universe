<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update</title>
</head>
<body>
    <h1>Actualizar la película</h1>
    <div th:if="${actualizado}">
        <p>La película <span th:text="${titulo}"></span> se ha actualizado</p>
    </div>
        <div th:if="${!actualizado}">
        <p>La película <span th:text="${titulo}"></span> no se ha actualizado</p>
    </div>
</body>
</html>
