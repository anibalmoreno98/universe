<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir documento</title>
</head>
<body>
    <h1>Añadir documento</h1>

<div th:if="${actualizado}">
        <p>El documento <span th:text="${documento}"></span> se ha añadido con éxito.</p>
    </div>
        <div th:if="${!actualizado}">
        <p>El documento <span th:text="${documento}"></span> no se ha añadido.</p>
    </div>
</body>
</html>
