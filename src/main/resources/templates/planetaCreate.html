<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear planeta</title>
</head>
<body>

    <th:block th:if="${created == false}">
        <p>No se ha podido crear el planeta.</p>
    </th:block>

    <th:block th:if="${created == true}">
        <p>El planeta ha sido creado correctamente</p>
    </th:block>
    
</body>
</html>
